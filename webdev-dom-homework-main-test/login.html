<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Авторизация — Проект Комменты</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="login-form">
        <h2 class="login-title">Вход в профиль</h2>
        <input
          type="text"
          id="login-input"
          class="login-input"
          placeholder="Введите логин"
        />
        <input
          type="password"
          id="password-input"
          class="login-input"
          placeholder="Введите пароль"
        />
        <button id="login-button" class="login-button">Войти</button>
        <a href="index.html" class="login-link">Назад к комментариям</a>
      </div>
    </div>
    <script type="module" src="./login.js"></script>
  </body>
</html>
