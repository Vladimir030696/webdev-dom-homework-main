<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Авторизация — Проект Комменты</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      background-color: #ffffff;
      padding: 24px;
      border-radius: 12px;
      max-width: 360px;
      margin: 100px auto 0 auto;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }
    .login-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
      text-align: center;
    }
    .login-input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    .login-button {
      background-color: #7334ea;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    .login-button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .login-link {
      text-align: center;
      color: #7334ea;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="login-form">
      <h2 class="login-title">Вход в профиль</h2>
      
      <input type="text" id="login-input" class="login-input" placeholder="Введите логин" />
      <input type="password" id="password-input" class="login-input" placeholder="Введите пароль" />
      
      <button id="login-button" class="login-button">Войти</button>
      
      <a href="index.html" class="login-link">Назад к комментариям</a>
    </div>
  </div>

  <script type="module" src="./login.js"></script>
</body>
</html>
