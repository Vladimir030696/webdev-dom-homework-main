<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      



<div id="comments-loader" class="loader" style="display: none; margin: 10px 0;">
  Загружаются комментарии...
</div>





      <ul class="comments" id="list">

        <li class="comment">
          <div class="comment-header">
            <div>Глеб Фокин</div>
            <div>12.02.22 12:18</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Это будет первый комментарий на этой странице
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter" id="counter">3</span>
              <button class="like-button" id="like"></button>
            </div>
          </div>
        </li>
        <li class="comment">
          <div class="comment-header">
            <div>Варвара Н.</div>
            <div>13.02.22 19:22</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Мне нравится как оформлена эта страница! ❤
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">75</span>
              <button class="like-button -active-like"></button>
            </div>
          </div>
        </li> 
      </ul>
      <div class="add-form">
        <input  
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
          id="field"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
          id="tex"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button" id="add">Написать</button>
        </div>
      </div>

















    </div>



  </body>
<style>
 









.spinner {
  display: inline-block;
  width: 50px;
  height: 50px;
  border: 2px solid #ccc;
  border-top-color: #333;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-right: 5px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}














.like-icon {
  width: 26px;
  height: 26px;
  fill: #7334ea; 
  stroke: #98e469;
  stroke-width: 2px;
}
.like-button {
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
}
.like-button.active .like-icon {
  fill: #ff4d4d;
} 
.comment-text{
  cursor: pointer;
}
</style>
  <script type="module" src="./index.js">
  </script>
</html>
